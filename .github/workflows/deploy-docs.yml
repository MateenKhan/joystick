name: Deploy docs site

# Builds on GitHub's runners and ships only the static output to the VPS.
# No container, no build tooling on the server — nginx just serves a folder.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The site consumes the package from `file:..`, so the library's dist
      # has to exist before the site is built.
      - name: Build the library
        run: |
          npm ci
          npm run build

      - name: Install site dependencies
        working-directory: website
        run: npm install

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh

          # Secrets pasted through a browser routinely pick up a trailing
          # newline or space. ssh then dies with "hostname contains invalid
          # characters", which points nowhere near the real cause.
          HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          USER_="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          PORT="$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')"
          {
            echo "SSH_HOST_CLEAN=$HOST"
            echo "SSH_USER_CLEAN=$USER_"
            echo "SSH_PORT_CLEAN=$PORT"
          } >> "$GITHUB_ENV"

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pin the host key so a hijacked DNS record can't collect the deploy key.
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Could not reach $HOST:$PORT — check the SSH_HOST secret and the firewall."
            exit 1
          fi

      - name: Deploy to VPS
        env:
          # nginx derives the web root from the hostname, so the folder is
          # named after the domain and no server config changes per site.
          SITE_DOMAIN: joystick.jugaaadi.com
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT_CLEAN"
          TARGET="$SSH_USER_CLEAN@$SSH_HOST_CLEAN"
          WEB_ROOT="/var/www/sites/$SITE_DOMAIN"

          # First deploy of a new site creates its folder; rsync won't.
          $SSH "$TARGET" "mkdir -p '$WEB_ROOT'"

          # Trailing slash on the source is required, or rsync nests a
          # build/ directory inside the web root.
          rsync -az --delete -e "$SSH" website/build/ "$TARGET:$WEB_ROOT/"

      - name: Summary
        run: echo "Deployed to https://joystick.jugaaadi.com" >> "$GITHUB_STEP_SUMMARY"
